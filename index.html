.hero .kicker:before{content:"✦  ";color:var(--gold)}
.section-glow{position:relative}
.section-glow:before{content:"";position:absolute;left:0;top:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,#b52b23,transparent)}

.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid #8f1b14;border-radius:999px;background:rgba(229,31,31,.14);color:#ffd15a;font-size:12px;font-weight:800;letter-spacing:1px;margin-top:10px}

.category-bar button{flex:0 0 auto;border:1px solid #692019;background:#210605;color:#d9b9ad;border-radius:999px;padding:9px 15px;font-weight:700}

<script>
let en=false;
const lang=document.getElementById('lang');
function apply(){document.querySelectorAll('[data-zh]').forEach(e=>e.textContent=en?e.dataset.en:e.dataset.zh);lang.textContent=en?'English　⌄':'中文　⌄'}
lang.onclick=()=>{en=!en;apply()};apply();
</script>

<script>
const input=document.getElementById('menuSearch');
const dishes=[...document.querySelectorAll('.dish')];
const chips=[...document.querySelectorAll('.chip')];
function filterMenu(){
  const q=(input.value||'').toLowerCase().trim();
  const active=document.querySelector('.chip.active')?.dataset.filter||'all';
  dishes.forEach(d=>{
    const text=(d.dataset.search||'').toLowerCase();
    const price=d.querySelector('strong')?.textContent.replace('S$','');
    let okText=!q||text.includes(q);
    let okPrice=active==='all'|| (active==='13.1'&&parseFloat(price)<=15) || (active==='17.4'&&parseFloat(price)>=16&&parseFloat(price)<=20.5) || (active==='23.2'&&parseFloat(price)>=21&&parseFloat(price)<=29) || (active==='29'&&parseFloat(price)>=29);
    d.style.display=okText&&okPrice?'grid':'none';
  });
}
input?.addEventListener('input',filterMenu);
chips.forEach(c=>c.addEventListener('click',()=>{chips.forEach(x=>x.classList.remove('active'));c.classList.add('active');filterMenu();}));
</script>

<script>
const resultCount=document.getElementById('resultCount');
const resetMenu=document.getElementById('resetMenu');
function updateCount(){if(!resultCount)return;const n=dishes.filter(d=>d.style.display!=='none').length;resultCount.textContent=`${n} items`;}
const oldFilter=filterMenu;
filterMenu=function(){oldFilter();updateCount();};
resetMenu?.addEventListener('click',()=>{input.value='';chips.forEach(x=>x.classList.remove('active'));document.querySelector('.chip[data-filter="all"]')?.classList.add('active');filterMenu();});
filterMenu();
</script>
